version: "3.8"

services:

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: cloudblitz
      MYSQL_DATABASE: student_db
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  backend:
    build: ./Backend        # ✅ IMPORTANT FIX (build from your Dockerfile)
    container_name: student-backend
    restart: always
    network_mode: "host"    # keeps your current working setup
    depends_on:
      - mysql

  frontend:
    build: ./Frontend       # ✅ build frontend from your Dockerfile
    container_name: student-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
